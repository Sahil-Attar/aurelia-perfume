<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed | Aurelia Fragrances</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .success-icon {
      width: 80px;
      height: 80px;
      background: #f1ede5;
      color: var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
    }
  </style>
</head>

<body class="bg-light d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg sticky-top border-bottom bg-white">
    <div class="container py-2 text-center">
      <a class="navbar-brand brand mx-auto" href="index.html">AURELIA</a>
    </div>
  </nav>

  <section class="py-5 flex-grow-1 d-flex align-items-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="summary-card text-center py-5 px-4">
            
            <div class="success-icon">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            
            <h1 class="h2 mb-2 section-title">Order Confirmed</h1>
            <p class="text-muted mb-4" id="success-customer-name">Thank you for your order.</p>
            
            <div class="bg-light p-4 rounded-3 mb-4 text-start">
              <p class="mb-1 text-muted small text-uppercase fw-bold">Your order number is:</p>
              <h2 class="h4 mb-3" id="success-order-id">#AUR-XXXXXXXX</h2>
              
              <div class="row">
                <div class="col-6">
                  <p class="mb-1 text-muted small">Payment Method</p>
                  <p class="fw-bold mb-3" id="success-payment-method">Cash on Delivery</p>
                </div>
                <div class="col-6">
                  <p class="mb-1 text-muted small">Order Total</p>
                  <p class="fw-bold mb-3" id="success-total">₹0.00</p>
                </div>
              </div>
              
              <div id="success-items" class="mt-2 pt-3 border-top">
                <!-- Items injected here -->
              </div>
            </div>
            
            <p class="small text-muted mb-4">
              We have received your order successfully.
              <br>This is a frontend test order. No emails have been sent.
            </p>
            
            <a href="shop.html" class="btn btn-gold px-5 py-3">Continue Shopping</a>
            
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer py-4 mt-auto">
    <div class="container text-center">
      <span class="text-white-50 small">© 2026 Aurelia Fragrances</span>
    </div>
  </footer>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const orderData = JSON.parse(localStorage.getItem("aurelia_latest_order"));
      
      if (!orderData) {
        window.location.href = "index.html";
        return;
      }
      
      document.getElementById("success-customer-name").textContent = `Thank you for your order, ${orderData.customer}.`;
      document.getElementById("success-order-id").textContent = `#${orderData.orderId}`;
      document.getElementById("success-payment-method").textContent = orderData.paymentMethod;
      document.getElementById("success-total").textContent = orderData.total;
      
      const itemsContainer = document.getElementById("success-items");
      let itemsHtml = '<p class="mb-2 text-muted small">Items:</p>';
      
      orderData.items.forEach(item => {
        const product = getProductById(item.id);
        const variation = getProductVariation(item.id, item.variationId || "50ml");
        if (product && variation) {
          itemsHtml += `
            <div class="d-flex justify-content-between small mb-1">
              <span>${product.name} (${variation.name}) × ${item.quantity}</span>
              <span class="text-muted">${formatCurrency(variation.price * item.quantity)}</span>
            </div>
          `;
        }
      });
      
      itemsContainer.innerHTML = itemsHtml;
      
      // Optionally clean up latest order so refreshing doesn't show it forever
      // localStorage.removeItem("aurelia_latest_order");
    });
  </script>
</body>
</html>
