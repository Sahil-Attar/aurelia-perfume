<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Shop Aurelia — premium fragrances crafted for unforgettable moments." />
  <title id="page-title">Product | Aurelia Fragrances</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <nav class="navbar navbar-expand-lg sticky-top border-bottom">
    <div class="container py-2">
      <a class="navbar-brand brand" href="index.html">AURELIA</a>
      <div class="d-flex align-items-center gap-3">
        <a class="text-dark text-decoration-none d-none d-md-block" href="shop.html">Shop</a>
        <a class="text-dark text-decoration-none position-relative" href="cart.html">
          Cart
          <span id="cart-count-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark">
            0
          </span>
        </a>
      </div>
    </div>
  </nav>

  <section class="py-5 bg-white flex-grow-1 d-flex align-items-center" style="min-height: 75vh;">
    <div class="container py-4">
      
      <div class="mb-4">
        <a href="shop.html" class="text-dark text-decoration-none border-bottom border-dark pb-1 text-uppercase small tracking-wide">← Back to Shop</a>
      </div>

      <div class="row g-5 align-items-center" id="product-container" style="display: none;">
        
        <!-- Left: Product Image -->
        <div class="col-lg-6">
          <div class="product-visual w-100 rounded-4" style="height: 500px; background: #f8f5ef;">
            <div id="product-bottle" class="bottle" style="transform: scale(1.3);" data-label="LABEL"></div>
          </div>
        </div>

        <!-- Right: Product Details -->
        <div class="col-lg-6">
          <div class="pe-lg-5">
            <div id="product-category" class="small text-uppercase text-secondary mb-2 fw-bold tracking-wide">Category</div>
            <h1 id="product-name" class="display-5 fw-bold mb-3 section-title">Product Name</h1>
            <p id="product-price" class="fs-4 mb-4 fw-medium text-dark">₹0.00</p>
            <p id="product-description" class="muted fs-5 mb-5 lh-base">
              Product description goes here.
            </p>

            <div class="mb-5 pb-2 border-bottom border-light">
              <label class="form-label fw-bold small text-uppercase mb-3 d-block">Select Size</label>
              <div id="product-variation-pills" class="variation-pills">
                <!-- Pill buttons injected by JS -->
              </div>
            </div>

            <div class="d-flex flex-wrap gap-3 align-items-center mb-4">
              <div class="d-flex align-items-center border rounded-3 p-1">
                <button class="btn btn-light border-0" id="btn-qty-minus" style="width: 40px;">-</button>
                <input type="text" id="product-qty" class="form-control border-0 text-center fw-bold bg-transparent" value="1" readonly style="width: 50px;">
                <button class="btn btn-light border-0" id="btn-qty-plus" style="width: 40px;">+</button>
              </div>
              <button id="btn-add-cart" class="btn btn-gold btn-lg px-5 py-3 rounded-pill fw-bold">Add to Cart</button>
            </div>
            
            <p class="small text-muted mt-4">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-1">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              Usually ships within 2-3 business days.
            </p>
            
          </div>
        </div>
      </div>
      
      <!-- Not Found State -->
      <div id="product-not-found" class="text-center py-5" style="display: none;">
        <h2 class="display-6 section-title mb-4">Product Not Found</h2>
        <a href="shop.html" class="btn btn-gold">Explore the Collection</a>
      </div>

    </div>
  </section>

  <footer class="footer py-4 mt-auto">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
      <span class="brand">AURELIA</span>
      <div class="d-flex gap-4">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart</a>
      </div>
      <span class="text-white-50">© 2026 Aurelia Fragrances</span>
    </div>
  </footer>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/product.js"></script>
</body>
</html>
